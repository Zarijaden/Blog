name: Scheduler

on:
  schedule:
    - cron: "0 17 * * 5"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Sync
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: sync.yml
          token: ${{ secrets.SYNC_TOKEN }}
          ref: main
          wait-for-completion: true
          wait-timeout-seconds: 120
          wait-interval-seconds: 10
          sync-status: true

      - name: Trigger Deploy
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: deploy.yml
          token: ${{ secrets.SYNC_TOKEN }}
          wait-for-completion: true
